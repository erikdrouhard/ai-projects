name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/webmcp-learning-project-ZK8gD, main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Build the React example
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build React example
        working-directory: examples/05-react-integration
        run: |
          npm ci
          npx vite build

      # Assemble a clean deploy directory
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r examples _site/examples
          # Replace React source with built output
          rm -rf _site/examples/05-react-integration/src \
                 _site/examples/05-react-integration/node_modules \
                 _site/examples/05-react-integration/package.json \
                 _site/examples/05-react-integration/package-lock.json \
                 _site/examples/05-react-integration/vite.config.js
          cp -r examples/05-react-integration/dist/* _site/examples/05-react-integration/

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
